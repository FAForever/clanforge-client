# Runs on every push and pull request. Keep this fast and dependency-free:
# a check nobody waits for is a check people learn to ignore.
name: CI

on:
  push:
  pull_request:

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # caches ~/.m2 keyed on pom.xml, so a run takes about a minute
          # instead of re-downloading every dependency
          cache: maven

      # No database on the runner, and that is deliberate. The four
      # database-backed tests skip themselves when SPRING_DATASOURCE_URL is
      # unset, so this needs no services and cannot fail for environment
      # reasons. Add a postgres service here when we want those four to run.
      # The test phase also writes the JaCoCo coverage report (target/site/jacoco).
      # The four database-backed tests skip without a datasource, so the figure
      # here is lower than a full local run (SPRING_DATASOURCE_URL set, ~87%).
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test

      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] && awk -F, 'NR>1{im+=$4;ic+=$5;lm+=$8;lc+=$9} END{printf "Instructions %.1f%%  Lines %.1f%%\n",100*ic/(ic+im),100*lc/(lc+lm)}' "$csv" >> "$GITHUB_STEP_SUMMARY" || true

      # Static analysis. Fails the build on a high-confidence bug (Max effort,
      # High threshold), so real defects, not style noise, block a merge.
      - name: Static analysis (SpotBugs)
        run: ./mvnw -B --no-transfer-progress spotbugs:check

      # The reports are what you actually want when a run goes red or to check
      # coverage, and they are gone once the runner is destroyed.
      - name: Upload test + coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  compose:
    name: docker-compose is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two seconds, and it catches the kind of YAML mistake that stops
      # docker compose up before it does anything at all.
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

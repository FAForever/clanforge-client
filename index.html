<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAForver — Sign In</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
  <div class="art-panel">
    <div class="art-scrim"></div>
    <div class="embers" id="embers"></div>
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2c2 3-1 4-1 7 0 2 2 3 2 5a4 4 0 01-8 0c0-2 1-3 1-5C6 6 9 4 12 2z" fill="#1c1204"/></svg>
      </span>
      FAForver
    </div>
  </div>

  <div class="form-panel">
    <div class="form-wrap">
      <h1>Welcome <span class="wave">👋</span></h1>
      <p class="subtitle">Please enter your email and password</p>

      <form id="loginForm" novalidate>
        <div class="field" id="emailField">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
          </span>
          <input type="text" id="email" placeholder="Email" autocomplete="username" />
          <div class="field-error">Please enter a valid email address.</div>
        </div>

        <div class="field" id="passwordField">
          <span class="icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
          </span>
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
          <div class="field-error">Password must be at least 4 characters.</div>
        </div>

        <div class="row-between">
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn" id="submitBtn">Login</button>
      </form>

      <div class="divider">Or</div>

      <div class="social-row">
        <button class="social-btn" aria-label="Continue with Google" type="button">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.76c-.99.66-2.25 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A11 11 0 0012 23z"/><path fill="#FBBC05" d="M5.84 14.11a6.6 6.6 0 010-4.22V7.04H2.18a11 11 0 000 9.92l3.66-2.85z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 00-9.82 6.04l3.66 2.85C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
        </button>
        <button class="social-btn" aria-label="Continue with Facebook" type="button">
          <svg viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
        </button>
      </div>

      <p class="register-row">Don't have an account? <a href="#">Register now!</a></p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

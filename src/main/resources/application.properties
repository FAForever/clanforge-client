spring.application.name=clan-management


# Connection. No defaults here: a deployed build reads all three from the
# environment, which is what the Scope of Work requires, and fails to start
# rather than quietly connecting to a development database. The development
# defaults live in application-dev.properties and apply only with the dev
# profile, the same profile that enables the in-memory admin account.
#
# Copy .env.example to .env and edit that rather than changing anything here,
# and never put a real credential in this file: it is committed.
#
# Running against the local no-installer cluster instead of the container? That
# one is on port 5433 with user clanadmin, started by db/start-db.ps1 and queried
# by db/psql.ps1. Point SPRING_DATASOURCE_URL at 5433 and it works the same.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# Flyway owns the schema from here on. V1__initial_schema.sql moved here from db/
# byte for byte, and db/ no longer keeps a copy: two files that must stay
# identical are two files that eventually do not.
# Adding a table means adding V2__whatever.sql beside it; it does not mean
# editing V1, which Flyway will reject once V1 has been applied anywhere.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Databases created before this change had V1 applied straight through psql, by
# hand or by docker-compose's old entrypoint mount, so they hold the tables but no
# flyway_schema_history. Without this Flyway refuses to start, reporting a
# non-empty schema with no history table. Baselining stamps such a database as
# already at version 1 and continues from V2. A fresh empty database is
# unaffected: it is empty, so V1 simply runs.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


# Validate, never create and never update. Hibernate compares its mapping to the
# schema Flyway built and refuses to start if the two disagree, so an entity that
# drifts from a migration is a startup failure rather than a surprise at runtime.
#
# This setting is also why the partial unique indexes survive. Hibernate cannot
# express a unique index on lower(tag) restricted to rows where deleted_at is
# null, so it must never be allowed to generate the schema.
spring.jpa.hibernate.ddl-auto=validate

# Off. Leaving it on holds a database session open for the whole request
# including view rendering, which hides lazy-loading mistakes until they reach
# production.
spring.jpa.open-in-view=false

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

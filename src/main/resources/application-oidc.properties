# OIDC against the local ORY Hydra from docker-compose.hydra.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.hydra.yml up -d
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=oidc
#
# Configuring a provider is what switches the application from the development
# form login to OIDC; SecurityConfig picks whichever is present rather than
# reading a flag. Sign in with any email and the password "foobar" - that is
# ORY's reference login app, not a real user store.
#
# The client secret here is a development value registered against the local
# Hydra. A deployed build must supply its own through the environment.
spring.security.oauth2.client.registration.hydra.client-id=clan-management
spring.security.oauth2.client.registration.hydra.client-secret=${OIDC_CLIENT_SECRET:dev-client-secret}
spring.security.oauth2.client.registration.hydra.client-name=FAForever
spring.security.oauth2.client.registration.hydra.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.hydra.scope=openid,offline_access
spring.security.oauth2.client.registration.hydra.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.hydra.issuer-uri=${OIDC_ISSUER_URI:http://localhost:4444}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:4444}
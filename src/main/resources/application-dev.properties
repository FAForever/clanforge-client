# Development profile only: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# The connection defaults match docker-compose.yml, so `docker compose up -d`
# followed by the command above needs no configuration at all. Each value is
# still overridable by environment variable.
#
# Running against the local no-installer cluster instead of the container? That
# one is on port 5433 with user clanadmin, started by db/start-db.ps1 and queried
# by db/psql.ps1. Point SPRING_DATASOURCE_URL at 5433 and it works the same.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/clan_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clanadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devpassword}

# Listen on this machine only. The dev profile signs people in as admin/admin, a
# site administrator, so a dev run must not be reachable from the rest of the
# network (a laptop on campus wifi). The compose app sets SERVER_ADDRESS=0.0.0.0
# because a container has to listen on its own network interface, and compose
# publishes that port on 127.0.0.1 only.
server.address=${SERVER_ADDRESS:127.0.0.1}

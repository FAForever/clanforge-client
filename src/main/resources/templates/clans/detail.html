<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${clan.name}">Clan</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <p><a th:href="@{/clans}">Back to clans</a></p>
    <p class="flash flash-notice" th:if="${notice}" th:text="${notice}">notice</p>
    <p class="flash flash-error" th:if="${error}" th:text="${error}">error</p>

    <img class="logo" th:if="${clan.hasLogo}" th:src="@{/clans/{id}/logo(id=${clan.id},v=${clan.logoUpdatedAt.toEpochSecond()})}" alt="">
    <h1>
        <span class="tag" th:text="${clan.tag}">TAG</span>
        <span th:text="${clan.name}">Clan name</span>
    </h1>

    <p th:if="${clan.description}" th:text="${clan.description}">Description</p>
    <p th:unless="${clan.description}" class="muted">No description.</p>

    <dl class="facts">
        <dt>Owner</dt>
        <dd th:text="${clan.owner != null ? clan.owner.displayName : 'unknown'}">owner</dd>
        <dt>Created</dt>
        <dd th:text="${#temporals.format(clan.createdAt, 'd MMMM yyyy')}">date</dd>
        <dt>Membership</dt>
        <dd th:text="${clan.requiresInvitation} ? 'Invitation only' : 'Open'">Open</dd>
        <dt>Members</dt>
        <dd th:text="${memberCount}">0</dd>
        <dt>Region</dt>
        <dd th:text="${clan.region != null} ? ${clan.region} : 'Not set'">region</dd>
    </dl>

    <!--/* join is a post, so it needs a signed-in person with no clan and a clan that is open */-->
    <form th:if="${canJoin}" th:action="@{/clans/{id}/join(id=${clan.id})}" method="post">
        <button type="submit" class="join">Join this clan</button>
    </form>
    <p th:if="${!signedIn and !clan.requiresInvitation}" class="muted"><a th:href="@{/login}">Sign in</a> to join this clan.</p>

    <h2>Members</h2>
    <ul class="members">
        <li th:each="m : ${roster}"><span th:text="${m.user.displayName}">name</span> <span class="muted" th:text="${m.roleLabel}">role</span></li>
    </ul>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0d12">
<title th:text="(${status} ?: 'Error') + ' · Clanforge'">Error · Clanforge</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/clanforge.css}">
<!--/* self-contained: no shared topbar fragment, so this page renders even when the
       error path does not populate the usual model attributes (me, isAdmin).
       The .error-* styles live in clanforge.css because the CSP blocks inline <style>. */-->
</head>
<body>
<main class="error-wrap">
  <div class="error-card">
    <svg class="error-crest" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2 L20 6.5 V15.5 L12 22 L4 15.5 V6.5 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M13.2 6.4 L8.3 13.6 H11.3 L10.1 17.6 L16 10 H12.6 Z" fill="currentColor"/>
    </svg>
    <p class="error-code" th:text="${status} ?: 'Error'">Error</p>
    <h1 class="error-title" th:text="${status == 404} ? 'Page not found' : 'Something went wrong'">Something went wrong</h1>
    <p class="error-text" th:text="${status == 404}
        ? 'The page you are looking for does not exist, or it may have moved.'
        : 'An unexpected error occurred on our end. Please try again in a moment.'">An error occurred.</p>
    <a class="btn btn-primary" th:href="@{/clans}">Back to Browse Clans</a>
  </div>
</main>
</body>
</html>

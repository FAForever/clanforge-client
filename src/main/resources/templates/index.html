<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">

  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clanforge</title>

  <link rel="stylesheet"
      href="/css/login.css"
      th:href="@{/css/login.css}">

</head>

<body>

  <!-- =========================
       HEADER
       ========================= -->

  <header>

    <h2 class="logo">CLANFORGE</h2>

    <nav class="navigation">

      <a th:href="@{/}">Home</a>

      <a th:href="@{/clans}">Explore</a>

      <a href="#">Inbox</a>

      <button type="button" class="btn-login">
        Login
      </button>

    </nav>

  </header>


  <!-- =========================
       LOGIN / REGISTER WRAPPER
       ========================= -->

  <div class="wrapper" th:classappend="${showLogin} ? 'active-popup' : ''">


    <!-- CLOSE BUTTON -->

    <button
      type="button"
      class="icon-close"
      aria-label="Close"
    >
      <span aria-hidden="true">&times;</span>
    </button>


    <!-- =========================
         LOGIN FORM
         ========================= -->

    <div class="form-box login">

      <h2>Login</h2>

      <form th:action="@{/login}" method="post">

        <p class="form-message form-message-error" th:if="${param.error}">Invalid username or password.</p>
        <p class="form-message form-message-success" th:if="${param.logout}">You have been signed out.</p>

        <!-- EMAIL -->

        <div class="input-box">

          <span class="icon">
            <span aria-hidden="true">&#64;</span>
          </span>

          <input type="text" name="username" autocomplete="username" required>

          <label>Username</label>

        </div>


        <!-- PASSWORD -->

        <div class="input-box">

          <span class="icon">
            <span aria-hidden="true">&#128274;</span>
          </span>

          <input type="password" name="password" autocomplete="current-password" required>

          <label>Password</label>

        </div>


        <!-- REMEMBER / FORGOT -->

        <div class="remember-forgot">

          <label>
            <input type="checkbox">
            Remember me
          </label>

          <a href="#">Forgot Password?</a>

        </div>


        <!-- LOGIN BUTTON -->

        <button type="submit" class="btn">
          Login
        </button>


        <!-- REGISTER LINK -->

        <div class="login-register">

          <p>
            Don't have an account?

            <a href="#" class="register-link">
              Join us
            </a>
          </p>

        </div>

      </form>

    </div>


    <!-- =========================
         REGISTER FORM
         ========================= -->

    <div class="form-box register">

      <h2>Join us</h2>

      <form id="registerForm" action="#">

        <!-- USERNAME -->

        <div class="input-box">

          <span class="icon">
            <span aria-hidden="true">&#128100;</span>
          </span>

          <input type="text" required>

          <label>Username</label>

        </div>


        <!-- EMAIL -->

        <div class="input-box">

          <span class="icon">
            <span aria-hidden="true">&#64;</span>
          </span>

          <input type="email" required>

          <label>Email</label>

        </div>


        <!-- PASSWORD -->

        <div class="input-box">

          <span class="icon">
            <span aria-hidden="true">&#128274;</span>
          </span>

          <input type="password" required>

          <label>Password</label>

        </div>


        <!-- TERMS -->

        <div class="remember-forgot">

          <label>
            <input type="checkbox">
            I agree to the Terms & Privacy Policy
          </label>

        </div>


        <!-- JOIN BUTTON -->

        <button type="submit" class="btn">
          Join
        </button>


        <!-- LOGIN LINK -->

        <div class="login-register">

          <p>
            Already have an account?

            <a href="#" class="login-link">
              Login
            </a>
          </p>

        </div>

      </form>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script src="/js/login.js"
        th:src="@{/js/login.js}"></script>

</body>

</html>
